# AetherOps — Multi-Agent Workflow Configuration
# Architecture: Supervisor + 5 Expert Agents
#
# Supervisor routes to each expert based on state readiness:
#   topology missing  → Topology Analyst
#   causal missing    → Causal Analyst
#   diagnosis missing → LLM Diagnostician
#   low confidence    → Causal Analyst (reanalyze)
#   risk missing      → Risk Assessor
#   execution missing → Remediation Executor
#   all done          → finish

workflow:
  name: "multi_agent_diagnosis"
  description: >
    Supervisor + 5 Expert Agents: topology analysis, causal inference,
    LLM diagnosis, risk assessment, graded remediation.

  agents:
    supervisor:
      description: >
        Orchestrator that inspects shared state and routes to the
        next expert agent. Routes based on priority order: topology
        → causal → diagnosis → risk → remediation → finish.

    topology_analyst:
      description: >
        Expert 1: Fetch current service topology from Go data plane via MCP
        (fallback: gRPC). Returns nodes and edges with anomaly scores.

    causal_analyst:
      description: >
        Expert 2: Fetch Prometheus metrics (5-min window) and run causal
        discovery (LPCMCI) to infer the causal graph of the anomaly.

    llm_diagnostician:
      description: >
        Expert 3: Send causal graph + anomaly context to LLM for diagnosis.
        Returns root cause, confidence, explanation, and recommended actions.

    risk_assessor:
      description: >
        Expert 4: Call Go blast_radius service via MCP to evaluate
        remediation risk (blast radius, error budget impact).

    remediation_executor:
      description: >
        Expert 5: Execute graded remediation, verify recovery (re-fetch metrics
        after 10s), generate Markdown fault report, store to RAG, and trigger
        DSPy prompt optimization.

  state_fields:
    - anomaly_event
    - topology_snapshot
    - topology_before       # pre-remediation snapshot for comparison
    - recovery_report       # Markdown recovery verification report
    - metrics_data
    - causal_graph
    - diagnosis_report
    - diagnosis_confidence
    - risk_report
    - execution_result
    - next_agent          # supervisor routing target
    - supervisor_instruction  # routing rationale
    - completed

  # ── Routing conditions (supervisor logic) ──
  routing:
    - condition: "topology_snapshot is None"
      agent: topology_analyst
    - condition: "causal_graph is None"
      agent: causal_analyst
    - condition: "diagnosis_report is None"
      agent: llm_diagnostician
    - condition: "confidence < 0.6 and loop_count < 2"
      agent: causal_analyst
      description: "re-analyze with fresh metrics"
    - condition: "risk_report is None"
      agent: risk_assessor
    - condition: "execution_result is None"
      agent: remediation_executor
    - condition: "all fields populated"
      agent: finish

  # ── Integrations ──
  integrations:
    go_mcp:
      address: "http://localhost:50052"
      transport: "mcp"       # default, set AETHEROPS_TRANSPORT=grpc for legacy gRPC
      timeout_seconds: 10

    go_grpc:
      address: "localhost:50051"
      transport: "grpc"
      timeout_seconds: 10

    prometheus:
      url: "http://localhost:9090"

    neo4j:
      enabled: true
      uri: "bolt://localhost:7687"
      user: "neo4j"
      password: "aetherops"

    milvus:
      enabled: true
      uri: "http://localhost:19530"

    llm:
      provider: "deepseek"  # DeepSeek V4 Flash (API-compatible with OpenAI)
      api_key_env: "LLM_API_KEY"
      api_url: "https://api.deepseek.com/v1/chat/completions"
      model: "deepseek-v4-flash"
      max_tokens: 4096

  # ── Alert Correlation ──
  alert_correlation:
    enabled: true
    window_seconds: 60
    storm_threshold: 20
    storm_window_seconds: 1
    cleanup_interval_seconds: 300

  # ── Multi-Turn Diagnosis ──
  multi_turn_diagnosis:
    enabled: true
    max_turns: 3
    reanalysis_threshold: 0.6
    max_loops: 2

  # ── Feedback Loop ──
  feedback:
    enabled: true
    auto_approve_low_risk: true
    require_approval_medium: true
    require_approval_high: true
    stats_window_days: 7
