apiVersion: apps/v1
kind: Deployment
metadata:
  name: neo4j
  namespace: {{ include "aetherops.namespace" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: neo4j
  template:
    metadata:
      labels:
        app: neo4j
    spec:
      containers:
        - name: neo4j
          image: {{ include "aetherops.image" (merge (dict "repository" .Values.neo4j.image.repository "tag" .Values.neo4j.image.tag "registry" .Values.neo4j.image.registry) .Values.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.neo4j.service.boltPort }}
              name: bolt
            - containerPort: {{ .Values.neo4j.service.httpPort }}
              name: http
          env:
            - name: NEO4J_AUTH
              value: "{{ .Values.neo4j.auth.username }}/{{ .Values.neo4j.auth.password }}"
            - name: NEO4J_PLUGINS
              value: '["apoc"]'
          resources:
            {{- toYaml .Values.neo4j.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          {{- if .Values.neo4j.persistence.enabled }}
          persistentVolumeClaim:
            claimName: neo4j-data
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: {{ include "aetherops.namespace" . }}
spec:
  ports:
    - port: {{ .Values.neo4j.service.boltPort }}
      targetPort: bolt
      name: bolt
    - port: {{ .Values.neo4j.service.httpPort }}
      targetPort: http
      name: http
  selector:
    app: neo4j
{{- if .Values.neo4j.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: neo4j-data
  namespace: {{ include "aetherops.namespace" . }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.neo4j.persistence.size }}
{{- end }}
