# AetherOps — K3s Deployment: Python Cognitive Core
# Deploys the LangGraph + LLM diagnosis engine.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aetherops-core
  namespace: ebpf-system
  labels:
    app: aetherops-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aetherops-core
  template:
    metadata:
      labels:
        app: aetherops-core
    spec:
      containers:
        - name: core
          image: aetherops-core:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9091
              name: health
          env:
            - name: AETHEROPS_GRPC_ADDR
              value: "localhost:50051"
            - name: PROMETHEUS_URL
              value: "http://prometheus:9090"
            - name: MILVUS_URI
              value: "http://milvus:19530"
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aetherops-secret
                  key: llm_api_key
                  optional: true
            - name: LLM_API_URL
              value: "https://api.openai.com/v1"
            - name: LLM_MODEL
              value: "claude-sonnet-4-6"
            - name: LOG_LEVEL
              value: "INFO"
            - name: ANOMALY_MIN_SCORE
              value: "0.5"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 9091
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Secret
metadata:
  name: aetherops-secret
  namespace: ebpf-system
type: Opaque
stringData:
  llm_api_key: ""  # Set your LLM API key here
---
apiVersion: v1
kind: Service
metadata:
  name: aetherops-core
  namespace: ebpf-system
spec:
  ports:
    - port: 9091
      targetPort: health
      name: health
  selector:
    app: aetherops-core
