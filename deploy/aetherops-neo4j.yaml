# AetherOps — K3s Deployment: Neo4j (Dependency Graph)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neo4j
  namespace: ebpf-system
  labels:
    app: neo4j
spec:
  replicas: 1
  selector:
    matchLabels:
      app: neo4j
  template:
    metadata:
      labels:
        app: neo4j
    spec:
      containers:
        - name: neo4j
          image: neo4j:5-community
          ports:
            - containerPort: 7474
              name: http
            - containerPort: 7687
              name: bolt
          env:
            - name: NEO4J_AUTH
              value: "neo4j/aetherops"
            - name: NEO4J_PLUGINS
              value: '["apoc"]'
          volumeMounts:
            - mountPath: /data
              name: neo4j-data
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
      volumes:
        - name: neo4j-data
          persistentVolumeClaim:
            claimName: neo4j-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: neo4j-pvc
  namespace: ebpf-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: ebpf-system
spec:
  ports:
    - port: 7474
      targetPort: http
      name: http
    - port: 7687
      targetPort: bolt
      name: bolt
  selector:
    app: neo4j
