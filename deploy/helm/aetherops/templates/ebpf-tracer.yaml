apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "aetherops.tracer.name" . }}
  namespace: {{ include "aetherops.namespace" . }}
spec:
  selector:
    matchLabels:
      {{- include "aetherops.tracer.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aetherops.tracer.labels" . | nindent 8 }}
    spec:
      hostNetwork: true
      hostPID: true
      serviceAccountName: {{ .Values.tracer.serviceAccount.name }}
      initContainers:
        - name: check-kernel
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "=== Kernel Check ==="
              uname -r
              if [ -f /sys/kernel/btf/vmlinux ]; then
                echo "BTF: enabled"
              else
                echo "BTF: NOT found — eBPF CO-RE may not work"
              fi
          securityContext:
            privileged: false
          volumeMounts:
            - name: sys-kernel-debug
              mountPath: /sys/kernel/debug
      containers:
        - name: tracer
          image: {{ include "aetherops.image" (merge (dict "repository" .Values.tracer.image.repository "tag" .Values.tracer.image.tag) .Values.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            capabilities:
              add:
                - CAP_BPF
                - CAP_NET_ADMIN
                - CAP_SYS_PTRACE
                - CAP_SYS_ADMIN
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: EBPF_IFACE
              value: {{ .Values.tracer.networkInterface | quote }}
            - name: AETHEROPS_MCP_ADDR
              value: ":50052"
            - name: AETHEROPS_GRPC_ADDR
              value: ":50051"
            {{- if .Values.tracer.extraEnv.FEISHU_WEBHOOK }}
            - name: FEISHU_WEBHOOK
              value: {{ .Values.tracer.extraEnv.FEISHU_WEBHOOK | quote }}
            {{- end }}
            {{- if .Values.tracer.extraEnv.HTTP_PROBE_TARGET }}
            - name: HTTP_PROBE_TARGET
              value: {{ .Values.tracer.extraEnv.HTTP_PROBE_TARGET | quote }}
            {{- end }}
            {{- range $key, $val := .Values.tracer.env }}
            {{- if $val }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            {{- end }}
          volumeMounts:
            - name: sys-kernel-debug
              mountPath: /sys/kernel/debug
          resources:
            {{- toYaml .Values.tracer.resources | nindent 12 }}
      volumes:
        - name: sys-kernel-debug
          hostPath:
            path: /sys/kernel/debug
      tolerations:
        {{- toYaml .Values.tracer.tolerations | nindent 8 }}
      {{- if .Values.tracer.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.tracer.nodeSelector | nindent 8 }}
      {{- end }}
