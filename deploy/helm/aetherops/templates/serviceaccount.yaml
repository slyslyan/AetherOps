apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.tracer.serviceAccount.name }}
  namespace: {{ include "aetherops.namespace" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.tracer.serviceAccount.name }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.tracer.serviceAccount.name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.tracer.serviceAccount.name }}
    namespace: {{ include "aetherops.namespace" . }}
roleRef:
  kind: ClusterRole
  name: {{ .Values.tracer.serviceAccount.name }}
  apiGroup: rbac.authorization.k8s.io
