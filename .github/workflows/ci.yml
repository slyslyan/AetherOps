name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v ./internal/...

      - name: Format check
        run: gofmt -l ./internal/ ./cmd/ | grep . && exit 1 || exit 0

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aetherops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install poetry
          poetry install --no-interaction

      - name: Test
        run: poetry run pytest tests/ -v
