# AetherOps — Cognitive Plane Docker Compose
#
# This compose file runs the AetherOps Python cognitive plane and its
# observability stack. The Go data plane (ebpf-autoheal) runs separately on
# Linux hosts with eBPF support (see Project Structure).
#
# Includes:
#   - aetherops-core (Python cognitive plane)
#   - Prometheus + Grafana (observability)
#
# Usage:
#   docker compose -f docker-compose.aetherops.yml up -d
#
# Note: The Go eBPF data plane requires Linux host with eBPF support.
# On non-Linux hosts, start it separately with `sudo ./ebpf-local`.

services:
  # ── AetherOps Python Core ──
  aetherops-core:
    build:
      context: ./python
      dockerfile: Dockerfile
    container_name: aetherops-core
    ports:
      - "9091:9091"  # health check
    environment:
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-deepseek-v4-flash}
      - PROMETHEUS_URL=http://prometheus:9090
      - LOG_LEVEL=INFO
    restart: unless-stopped
    command: ["python", "-m", "aetherops.main", "--daemon"]

  # ── Prometheus ──
  prometheus:
    image: prom/prometheus:v3
    container_name: aetherops-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    restart: unless-stopped

  # ── Grafana ──
  grafana:
    image: grafana/grafana:latest
    container_name: aetherops-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=aetherops
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
